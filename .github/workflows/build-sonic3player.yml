name: Build Sonic3Player PRO

on:
  push:
    branches: ["sonic3player-build"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Extract source
        run: unzip -q Sonic3Player_COMPILE_ONLY.zip -d workspace

      - name: Build Forge mod
        working-directory: workspace/Sonic3Player_PRO_Source
        run: gradle --no-daemon clean build --stacktrace

      - name: List outputs
        if: always()
        run: find workspace/Sonic3Player_PRO_Source/build -maxdepth 3 -type f -print || true

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Sonic3Player-PRO-2.0.0
          path: workspace/Sonic3Player_PRO_Source/build/libs/*.jar
          if-no-files-found: error
